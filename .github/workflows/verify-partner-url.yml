name: Verify Partner Workspace URL

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-partner-url.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify partner-rsf in Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          alias = "https://partner-rsf.onrender.com/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(alias, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(8000)
              print("HTTP_STATUS=" + (str(response.status) if response else "NONE"))
              print("CURRENT_URL=" + page.url)
              print("TITLE=" + page.title())
              body = page.locator("body").inner_text(timeout=10000)
              print("BODY_START=" + body[:800].replace("\n", " | "))
              if not page.url.startswith("https://realtysystemsfoundry.onrender.com/app/"):
                  raise RuntimeError("Partner alias did not reach the RSF /app/ workspace")
              if "Sign in" not in body:
                  raise RuntimeError("RSF Sign in page was not found")
              print("BROWSER_CHECK_OK")
              browser.close()
          PY
