name: RSF Account Security Audit

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  account-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app scripts bootstrap.py config.py run.py wsgi.py
      - name: Verify account security hardening
        env:
          RSF_DISABLE_BACKGROUND: "1"
        run: |
          python -m unittest -v tests.test_audit_hardening
          python - <<'PY'
          from pathlib import Path
          source = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in [
                  Path("app/routes.py"),
                  Path("app/templates/account_security.html"),
                  Path("app/static/js/app.js"),
                  Path("config.py"),
                  Path("requirements.txt"),
              ]
          )
          for forbidden in (
              "account_security_reveal_password",
              "data-vault-reveal",
              "data-vault-copy",
              "RETELL_API_KEY",
              "RETELL_AGENT_ID",
              "RETELL_FROM_NUMBER",
              "retell-sdk",
              "AI Call",
          ):
              assert forbidden not in source, forbidden
          print("ACCOUNT_SECURITY_AUDIT_OK")
          PY
