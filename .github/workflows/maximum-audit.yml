name: RSF Maximum Audit

on:
  pull_request:
    branches: [ main ]

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app config.py run.py wsgi.py
      - name: Run Founder Partner lifecycle, security, privacy and deletion audit
        run: |
          python - <<'PY'
          import os, re, tempfile
          from pathlib import Path
          os.environ["RSF_DISABLE_BACKGROUND"]="1"

          from app import create_app
          from app.db import get_db
          from app.auth import hash_password
          from app.services import PIPELINE

          ROOT=Path.cwd()
          def csrf(resp):
              m=re.search(r'name="csrf_token" value="([^"]+)"',resp.get_data(as_text=True))
              assert m, "missing CSRF token"
              return m.group(1)
          def login(client,email,password,ok=True):
              token=csrf(client.get("/app/login"))
              r=client.post("/app/login",data={"csrf_token":token,"email":email,"password":password},follow_redirects=False)
              if ok: assert r.status_code in (302,303),(email,r.status_code,r.data[:500])
              else: assert r.status_code not in (302,303),(email,"unexpected login")
              return r

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              app=create_app({
                  "TESTING":True,
                  "SECRET_KEY":"audit-only-secret",
                  "DATABASE_URL":"",
                  "DATABASE":str(root/"audit.db"),
                  "MESSAGE_UPLOAD_DIR":str(root/"message_uploads"),
                  "PROFILE_PICTURE_DIR":str(root/"profile_pictures"),
                  "CLIENT_ATTACHMENT_DIR":str(root/"client_attachments"),
                  "BACKUP_DIR":str(root/"backups"),
                  "TRUSTED_HOSTS":["localhost"],
                  "SESSION_COOKIE_SECURE":False,
              })
              now="2026-01-01T00:00:00+00:00"
              founder_email="founder-audit@example.test"
              founder_password="FounderAuditPassword"
              exact_password="x"
              reset_password="!"
              partner_email="partner-audit@example.test"

              with app.app_context():
                  db=get_db()
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert db.execute("SELECT MAX(version) FROM schema_migrations").fetchone()[0]>=12
                  assert "deleted_at" in {r["name"] for r in db.execute("PRAGMA table_info(partners)").fetchall()}
                  stages=[(r["name"],r["rate_bp"]) for r in db.execute("SELECT name,rate_bp FROM commission_stages ORDER BY sort_order").fetchall()]
                  assert stages==[("Founding Partner #1",4000),("Early Partner",3000),("Established Sales Partner",2000),("Standard Partner",1500)]
                  assert list(PIPELINE)==["NEW","CONTACTED","QUALIFIED","DEMO_BOOKED","PROPOSAL","WON","LOST"]
                  db.execute("""INSERT INTO users(full_name,email,password_hash,role,active,force_password_change,created_at,updated_at)
                                VALUES (?,?,?,'admin',1,0,?,?)""",
                             ("Founder Audit",founder_email,hash_password(founder_password),now,now))
                  db.commit()

              founder=app.test_client()
              login(founder,founder_email,founder_password)
              assert app.test_client().get("/",headers={"Host":"evil.example"}).status_code==400
              p=founder.get("/app/founder/partners",follow_redirects=False)
              assert p.status_code==200 and b"Add Partner" in p.data
              assert p.headers.get("X-Content-Type-Options")=="nosniff"
              assert p.headers.get("X-Frame-Options")=="DENY"
              assert "no-store" in p.headers.get("Cache-Control","")
              assert "frame-ancestors 'none'" in p.headers.get("Content-Security-Policy","")
              assert founder.post("/app/founder/partners/new",data={"email":"x@example.test"}).status_code==400

              ui="\n".join(x.read_text(encoding="utf-8",errors="replace") for x in (ROOT/"app"/"templates").rglob("*.html"))
              for bad in ("Founder / Admin","Founder Admin","Employee","Employee Partner","Partner Employee","Sales Partner","Administration","Temporary password","Allow sign in","Deactivate","Reactivate","Inactive"):
                  assert bad.lower() not in ui.lower(),bad
              assert not re.findall(r"<(?:h[1-6]|strong)[^>]*>[^<]*?/[^<]*?</(?:h[1-6]|strong)>",ui,flags=re.I)
              js=(ROOT/"app"/"static"/"js"/"app.js").read_text(encoding="utf-8")
              assert "data-generate-password" not in js
              assert "data-password-toggle" in js and "data-password-copy" in js and "data-copy-text" in js

              create=founder.get("/app/founder/partners/new")
              with app.app_context():
                  stage_id=get_db().execute("SELECT id FROM commission_stages WHERE code='EARLY'").fetchone()["id"]
              created=founder.post("/app/founder/partners/new",data={
                  "csrf_token":csrf(create),"full_name":"Disposable Partner","email":partner_email,
                  "password":exact_password,"phone":"","commission_stage_id":str(stage_id),"notes":"audit"
              },follow_redirects=False)
              html=created.get_data(as_text=True)
              assert created.status_code==200 and exact_password in html
              for bad in ("too weak","stronger password","uppercase","lowercase","add a symbol","letters and numbers"):
                  assert bad not in html.lower(),bad

              with app.app_context():
                  db=get_db()
                  row=db.execute("""SELECT p.id,p.user_id FROM partners p JOIN users u ON u.id=p.user_id
                                    WHERE u.email=? AND p.deleted_at IS NULL""",(partner_email,)).fetchone()
                  assert row
                  partner_id,user_id=int(row["id"]),int(row["user_id"])

              partner=app.test_client()
              login(partner,partner_email,exact_password)
              for url in ("/app/founder/partners","/app/founder/partners/new",f"/app/founder/partners/{partner_id}"):
                  assert partner.get(url,follow_redirects=False).status_code==403,url
              profile=partner.get("/app/profile")
              profile_html=profile.get_data(as_text=True)
              assert "Current password" not in profile_html
              assert 'name="full_name"' not in profile_html and 'name="email"' not in profile_html and 'name="phone"' not in profile_html
              token=csrf(profile)
              assert partner.post(f"/app/founder/partners/{partner_id}/password",data={"csrf_token":token,"password":"forged"}).status_code==403
              assert partner.post(f"/app/founder/partners/{partner_id}/delete",data={"csrf_token":token}).status_code==403
              assert partner.post("/app/profile",data={"csrf_token":token,"action":"password","current_password":exact_password,"new_password":"z","confirm_password":"z"}).status_code==403
              assert partner.post("/app/profile",data={"csrf_token":token,"action":"profile","full_name":"Forged","email":"f@example.test"}).status_code==403

              with app.app_context():
                  db=get_db()
                  other_user=db.execute("""INSERT INTO users(full_name,email,password_hash,role,active,force_password_change,created_at,updated_at)
                                           VALUES (?,?,?,'partner',1,0,?,?)""",
                                        ("Other Partner","other@example.test",hash_password("o"),now,now)).lastrowid
                  other_partner=db.execute("""INSERT INTO partners(user_id,commission_stage_id,phone,notes,joined_at,active,deleted_at)
                                              VALUES (?,?,?,?,?,1,NULL)""",(other_user,stage_id,"","",now)).lastrowid
                  other_lead=db.execute("""INSERT INTO leads(owner_partner_id,company_name,company_norm,contact_name,contact_norm,email,email_norm,
                      phone,phone_norm,website,website_domain,lead_source,summary_notes,status,lost_reason,demo_at,registered_at,last_activity_at,created_by_user_id)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (other_partner,"PRIVATE_OTHER","private_other","Other","other","other@example.test","other@example.test",
                       "","","","","Audit","","NEW","",None,now,now,other_user)).lastrowid
                  db.execute("INSERT INTO messages(partner_id,sender_user_id,body,created_at) VALUES (?,?,?,?)",(other_partner,other_user,"OTHER_PRIVATE_MESSAGE",now))
                  db.commit()
              assert partner.get(f"/app/leads/{other_lead}").status_code==404
              assert partner.get(f"/app/messages/{other_partner}").status_code==404

              detail=founder.get(f"/app/founder/partners/{partner_id}")
              changed=founder.post(f"/app/founder/partners/{partner_id}/password",
                  data={"csrf_token":csrf(detail),"password":reset_password},follow_redirects=False)
              assert changed.status_code==200 and reset_password in changed.get_data(as_text=True)
              login(app.test_client(),partner_email,exact_password,ok=False)
              login(app.test_client(),partner_email,reset_password,ok=True)
              assert partner.get("/app/",follow_redirects=False).status_code in (302,303)

              with app.app_context():
                  db=get_db()
                  lead_id=db.execute("""INSERT INTO leads(owner_partner_id,company_name,company_norm,contact_name,contact_norm,email,email_norm,
                      phone,phone_norm,website,website_domain,lead_source,summary_notes,status,lost_reason,demo_at,registered_at,last_activity_at,created_by_user_id)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (partner_id,"DELETE_TEST","delete_test","Client","client","client@example.test","client@example.test",
                       "","","","","Audit","","WON","",None,now,now,user_id)).lastrowid
                  sale_id=db.execute("""INSERT INTO sales(lead_id,partner_id,client_name,product_service,deal_amount_cents,invoiced_cents,
                      collected_cents,qualifying_revenue_cents,payment_status,sale_date,notes,created_by_user_id,created_at,updated_at)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (lead_id,partner_id,"Client","Audit System",10000,10000,10000,10000,"PAID","2026-01-01","",user_id,now,now)).lastrowid
                  db.execute("""INSERT INTO commissions(sale_id,partner_id,stage_name_snapshot,rate_bp_snapshot,qualifying_revenue_cents,
                      adjustment_cents,commission_amount_cents,status,approval_date,paid_date,notes,created_at,updated_at)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (sale_id,partner_id,"Early Partner",3000,10000,0,3000,"PAID",now,now,"",now,now))
                  db.execute("INSERT INTO messages(partner_id,sender_user_id,body,created_at) VALUES (?,?,?,?)",(partner_id,user_id,"historical message",now))
                  inquiry_id=db.execute("""INSERT INTO website_inquiries(created_at,updated_at,name,email,email_norm,company,message,status,
                      claimed_by_partner_id,claimed_at,lead_id,source_type,source_slug,source_title,source_action)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (now,now,"Client","client@example.test","client@example.test","DELETE_TEST","hello","CLAIMED",
                       partner_id,now,lead_id,"website","","Audit","contact")).lastrowid
                  conversation_id=db.execute("""INSERT INTO client_conversations(inquiry_id,lead_id,owner_partner_id,client_name,client_email,company,
                      subject,status,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?)""",
                      (inquiry_id,lead_id,partner_id,"Client","client@example.test","DELETE_TEST","Audit","ACTIVE",now,now)).lastrowid
                  db.execute("""INSERT INTO client_messages(conversation_id,direction,channel,sender_email,recipient_email,subject,body,
                      sent_by_user_id,external_message_id,in_reply_to,created_at,delivery_status,delivery_error)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (conversation_id,"OUTBOUND","EMAIL","rsf@example.test","client@example.test","Audit","history",user_id,"","",now,"SENT",""))
                  db.execute("UPDATE website_inquiries SET client_conversation_id=? WHERE id=?",(conversation_id,inquiry_id))
                  tables=("leads","sales","commissions","messages","website_inquiries","client_conversations","client_messages")
                  before={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0] for t in tables}
                  db.commit()

              delete_page=founder.get(f"/app/founder/partners/{partner_id}")
              deleted=founder.post(f"/app/founder/partners/{partner_id}/delete",data={"csrf_token":csrf(delete_page)},follow_redirects=False)
              assert deleted.status_code in (302,303)
              login(app.test_client(),partner_email,reset_password,ok=False)
              assert founder.get(f"/app/founder/partners/{partner_id}").status_code==404
              listing=founder.get("/app/founder/partners").get_data(as_text=True)
              assert partner_email not in listing and "Disposable Partner" not in listing
              with app.app_context():
                  db=get_db()
                  tomb=db.execute("""SELECT p.deleted_at,p.active pa,u.full_name,u.email,u.active ua,u.avatar_stored_name
                                     FROM partners p JOIN users u ON u.id=p.user_id WHERE p.id=?""",(partner_id,)).fetchone()
                  assert tomb and tomb["deleted_at"] and tomb["pa"]==0 and tomb["ua"]==0 and tomb["full_name"]=="Deleted Partner"
                  assert tomb["email"]!=partner_email and not tomb["avatar_stored_name"]
                  after={t:db.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0] for t in before}
                  assert after==before,(before,after)
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert not db.execute("PRAGMA foreign_key_check").fetchall()

              print("V190_SOURCE_SECURITY_AUDIT_OK")
          PY
