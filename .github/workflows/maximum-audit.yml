name: RSF Maximum Audit

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app tests scripts bootstrap.py config.py run.py wsgi.py
      - name: Run complete regression suite
        env:
          RSF_DISABLE_BACKGROUND: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify current install/bootstrap contract
        env:
          RSF_DISABLE_BACKGROUND: "1"
        run: python scripts/VERIFY_INSTALLED_SYSTEM.py
      - name: Verify release security invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          version=Path("VERSION.txt").read_text().strip()
          assert version == "1.18.230", version
          init=Path("app/__init__.py").read_text()
          for endpoint in (
              "main.retell_webhook",
              "main.whatsapp_webhook_receive",
              "main.twilio_manual_call_twiml",
              "main.twilio_manual_call_client_notice",
              "main.twilio_manual_call_conference_webhook",
              "main.twilio_manual_call_status_webhook",
              "main.twilio_manual_call_recording_webhook",
              "main.twilio_manual_call_transcription_webhook",
          ):
              assert endpoint in init, endpoint
          schema=Path("app/schema.sql").read_text()
          assert "account_password_vault" not in schema
          db_source=Path("app/db.py").read_text()
          assert "CREATE TABLE IF NOT EXISTS ai_sales_calls" in db_source
          routes=Path("app/routes.py").read_text()
          assert "def prospect_ai_call" in routes
          assert "def retell_webhook" in routes
          assert "INSERT INTO ai_sales_calls" in routes
          assert "UPDATE ai_sales_calls" in routes
          assert "X-Retell-Signature" in routes
          print("MAXIMUM_AUDIT_OK")
          PY
