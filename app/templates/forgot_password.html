{% extends 'base.html' %}{% block guest %}
<main class="login-shell" id="main-content" tabindex="-1">
  <section class="login-card" aria-labelledby="reset-title">
    <div class="login-brand"><span class="brand-mark large" aria-hidden="true"><img src="{{ url_for('static', filename='images/brand/icon_128.png') }}" alt=""></span><div><strong>Realty Systems Foundry</strong><span>RSF Workspace</span></div></div>
    <div class="login-copy"><h1 id="reset-title">Reset Password</h1><p>Use your saved Founder recovery code. The old password cannot be revealed.</p></div>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Founder Name<input type="text" name="name" autocomplete="username" required maxlength="160" autofocus value="{{ request.form.get('name','') }}"></label>
      <label>Recovery Code<input type="text" name="recovery_code" autocomplete="one-time-code" required maxlength="128"></label>
      <label>New Password<input type="password" name="new_password" autocomplete="new-password" required maxlength="128"></label>
      <label>Confirm New Password<input type="password" name="confirm_password" autocomplete="new-password" required maxlength="128"></label>
      <small>RSF does not require a minimum password length. Short passwords are easier to guess.</small>
      <button class="button primary wide" type="submit">Create New Password</button>
      <a class="button ghost wide" href="{{ url_for('main.login') }}">Back to Log In</a>
    </form>
  </section>
</main>
{% endblock %}
