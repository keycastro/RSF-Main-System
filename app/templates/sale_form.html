{% extends 'base.html' %}
{% block content %}
<div class="page-head workspace-page-head">
  <div>
    <h1>Create Sale</h1>
    <p>Record the closed sale and payment amounts.</p>
  </div>
  <a class="button secondary" href="{{ url_for('main.sales_list') }}">Cancel</a>
</div>
<section class="panel form-panel refined-form-panel">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="span-2">Lead <span class="required-mark">Required</span>
      <select name="lead_id" required>
        {% set chosen_lead_id = request.form.get('lead_id') or selected_lead_id %}
        <option value="">Choose lead</option>
        {% for l in leads %}<option value="{{ l.id }}" {{ 'selected' if chosen_lead_id|string == l.id|string else '' }}>{{ l.company_name }} — {{ l.owner_name }}</option>{% endfor %}
      </select>
    </label>
    <label class="span-2">Service <span class="required-mark">Required</span>
      <input name="product_service" required maxlength="240" value="{{ request.form.get('product_service','') }}" placeholder="CRM build, automation system, integration...">
    </label>
    <div class="form-section span-2">
      <strong>Revenue</strong>
      <span>Keep the agreed, invoiced, collected, and commissionable amounts clear.</span>
    </div>
    <label>Agreed amount
      <input type="number" name="deal_amount" inputmode="decimal" min="0" step="0.01" value="{{ request.form.get('deal_amount','0.00') }}">
    </label>
    <label>Invoiced
      <input type="number" name="amount_invoiced" inputmode="decimal" min="0" step="0.01" value="{{ request.form.get('amount_invoiced','0.00') }}">
    </label>
    <label>Collected
      <input type="number" name="amount_collected" inputmode="decimal" min="0" step="0.01" value="{{ request.form.get('amount_collected','0.00') }}">
    </label>
    <label>Commission revenue
      <input type="number" name="qualifying_revenue" inputmode="decimal" min="0" step="0.01" value="{{ request.form.get('qualifying_revenue','0.00') }}">
      <small class="help">Used to calculate commission. It cannot be more than collected.</small>
    </label>
    <label>Payment status
      <select name="payment_status">{% for s in ['UNPAID','PARTIALLY_PAID','PAID','REFUNDED_ADJUSTED'] %}<option value="{{ s }}" {{ 'selected' if request.form.get('payment_status','UNPAID')==s else '' }}>{{ s|human_status }}</option>{% endfor %}</select>
    </label>
    <label>Sale date
      <input type="date" name="sale_date" value="{{ request.form.get('sale_date', today) }}">
    </label>
    <label class="span-2">Notes
      <textarea name="notes" rows="4" maxlength="4000" placeholder="Optional internal context">{{ request.form.get('notes','') }}</textarea>
    </label>
    <div class="form-actions span-2"><button class="button primary" type="submit">Create Sale</button></div>
  </form>
</section>
{% endblock %}
