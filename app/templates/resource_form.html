{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1></div><a class="button secondary" href="{{ url_for('main.resources_list') }}">Cancel</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Category<select name="category" required>{% for c in categories %}<option value="{{ c }}" {{ 'selected' if resource and resource.category==c else '' }}>{{ c }}</option>{% endfor %}</select></label><label>Title<input name="title" required maxlength="200" value="{{ resource.title if resource else '' }}"></label><label class="span-2">Content<textarea name="body" rows="10" maxlength="10000">{{ resource.body if resource else '' }}</textarea></label><label class="span-2">Link (optional)<input type="url" name="url" maxlength="500" placeholder="https://..." value="{{ resource.url if resource else '' }}"></label><label class="check-row span-2"><input type="checkbox" name="published" value="1" {{ 'checked' if not resource or resource.published else '' }}><span><strong>Show to partners</strong><small>Turn off to keep this as a draft.</small></span></label><div class="form-actions span-2"><button class="button primary" type="submit">Save</button></div></form></section>
{% endblock %}
