{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><h1>Add Partner</h1></div><a class="button secondary" href="{{ url_for('main.partners_list') }}">Cancel</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" required maxlength="160"></label><label>Email<input type="email" name="email" required maxlength="254"></label><label>Phone<input name="phone" maxlength="60"></label><label>Commission level<select name="commission_stage_id" required><option value="">Choose level</option>{% for s in stages %}<option value="{{ s.id }}">{{ s.name }} — {{ s.rate_bp|rate }}</option>{% endfor %}</select></label><label class="span-2">Password<div class="password-row"><input id="temporary_password" name="temporary_password" type="text" minlength="12" required autocomplete="off"><button class="button ghost" type="button" data-generate-password data-target="temporary_password">Generate</button></div><small class="help">12+ characters with letters and numbers.</small></label><label class="span-2">Notes<textarea name="notes" rows="4" maxlength="2000"></textarea></label><div class="form-actions span-2"><button class="button primary" type="submit">Create Partner</button></div></form></section>
{% endblock %}
