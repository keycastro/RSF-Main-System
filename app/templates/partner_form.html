{% extends 'base.html' %}
{% block content %}
<div class="page-head workspace-page-head">
  <div><h1>Create Partner</h1><p>Create the Partner account and login.</p></div>
  <a class="button secondary" href="{{ url_for('main.partners_list') }}">Cancel</a>
</div>
<section class="panel form-panel refined-form-panel">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name <span class="required-mark">Required</span><input name="full_name" required maxlength="160" value="{{ request.form.get('full_name','') }}" autocomplete="name"></label>
    <label>Email <span class="required-mark">Required</span><input type="email" name="email" required maxlength="254" value="{{ request.form.get('email','') }}" autocomplete="email"></label>
    <label>Phone<input name="phone" maxlength="60" value="{{ request.form.get('phone','') }}" autocomplete="tel"></label>
    <label>Commission stage <span class="required-mark">Required</span><select name="commission_stage_id" required><option value="">Choose stage</option>{% for s in stages %}<option value="{{ s.id }}" {{ 'selected' if request.form.get('commission_stage_id')==s.id|string else '' }}>{{ s.name }} — {{ s.rate_bp|rate }}</option>{% endfor %}</select></label>
    <label class="span-2">Password <span class="required-mark">Required</span>
      <div class="password-row partner-password-row"><input id="partner_password" name="password" type="password" required autocomplete="new-password" value="{{ request.form.get('password','') }}"><button class="button ghost" type="button" data-password-toggle data-target="partner_password">Show</button><button class="button ghost" type="button" data-copy-target="partner_password">Copy</button></div>
      <small class="help">Use the exact password you want. RSF does not change it or apply password-strength rules.</small>
    </label>
    <label class="span-2">Internal notes<textarea name="notes" rows="4" maxlength="2000" placeholder="Optional Founder-only context">{{ request.form.get('notes','') }}</textarea></label>
    <div class="form-actions span-2"><button class="button primary" type="submit">Create Partner</button></div>
  </form>
</section>
{% endblock %}
