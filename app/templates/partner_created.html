{% extends 'base.html' %}
{% block content %}
<div class="page-head organized-page-head">
  <div><span class="page-kicker">Partner</span><h1>Partner Created</h1><p>Copy the login details now. RSF does not store the password as readable text.</p></div>
</div>
<section class="credential-card refined-credential-card">
  <div class="credential-title"><span class="status-dot is-ready" aria-hidden="true"></span><div><span>Login</span><strong>{{ partner.full_name }}</strong></div></div>
  <div class="credential-grid">
    <div><span>Email</span><strong>{{ partner.email }}</strong></div>
    <div><span>Password</span><strong id="chosen_password" class="mono credential-password">{{ chosen_password }}</strong></div>
  </div>
  <div class="page-actions"><button class="button primary" type="button" data-copy-text data-target="chosen_password">Copy Password</button><a class="button secondary" href="{{ url_for('main.partner_detail',partner_id=partner.id) }}">Open Partner</a><a class="button secondary" href="{{ url_for('main.partners_list') }}">Partners</a></div>
</section>
{% endblock %}
