{% extends 'base.html' %}
{% block content %}
<div class="page-head workspace-page-head">
  <div><h1>Partner created</h1><p>The login is ready to use.</p></div>
</div>
<section class="credential-card refined-credential-card">
  <div class="credential-title"><span class="status-dot is-ready" aria-hidden="true"></span><div><span>Login details</span><strong>{{ partner.full_name }}</strong></div></div>
  <div class="credential-grid">
    <div><span>Email</span><strong>{{ partner.email }}</strong></div>
    <div><span>Password</span><strong id="created_partner_password" class="mono credential-password">{{ chosen_password }}</strong><button class="button ghost small credential-copy" type="button" data-copy-text data-target="created_partner_password">Copy password</button></div>
  </div>
  <p class="credential-note">The Founder can view or copy this password later in Account &amp; Security.</p>
  <div class="page-actions"><a class="button primary" href="{{ url_for('main.partner_detail',partner_id=partner.id) }}">View Partner</a><a class="button secondary" href="{{ url_for('main.partners_list') }}">Partners</a></div>
</section>
{% endblock %}
