{% extends 'base.html' %}{% block content %}
<div class="page-head workspace-page-head client-inbox-head">
  <div><h1>Website Inbox</h1><p>New inquiries and active client conversations.</p></div>
</div>
{% if not unclaimed and not claimed %}
<div class="website-inbox-empty" role="status">
  <div class="website-inbox-empty-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false">
      <path d="M4 5.2h16v13.6H4z"></path>
      <path d="M4 13h4l1.6 2.2h4.8L16 13h4M8 8.5h8"></path>
    </svg>
  </div>
  <strong>No website inquiries yet.</strong>
  <span>New customer inquiries will appear here.</span>
</div>
{% endif %}
{% endblock %}
