<section class="conversation-whatsapp-panel" data-whatsapp-panel hidden data-csrf-token="{{ csrf_token() }}" aria-label="WhatsApp Conversation">
  <header class="conversation-whatsapp-panel-head">
    <div class="conversation-whatsapp-identity">
      <span class="conversation-whatsapp-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3a8.5 8.5 0 0 0-7.2 13L4 21l5-1.3A8.5 8.5 0 1 0 12 3Zm4.8 12.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1.1.2-3.5-.8-2.9-1.2-4.8-4.2-4.9-4.4-.1-.2-1.2-1.6-1.2-3 0-1.4.7-2.1 1-2.4.2-.2.5-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.3.1.5 0 .7l-.3.5-.5.6c-.2.2-.3.4-.1.7.2.3.8 1.3 1.8 2.1 1.2 1.1 2.3 1.4 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.3.5-.3.7-.2l2 .9c.3.1.5.2.6.3.1.1.1.6-.1 1.2Z" fill="currentColor"/></svg>
      </span>
      <div>
        <strong>WhatsApp Conversation</strong>
        <span data-whatsapp-recipient></span>
      </div>
    </div>
    <div class="conversation-whatsapp-head-actions">
      <button type="button" class="conversation-whatsapp-call" data-whatsapp-call disabled aria-disabled="true" title="WhatsApp Calling is not connected yet.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.8 3.5 3.1 4.8 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.4.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1.1l-2.2 2.2Z" fill="currentColor"/></svg>
        <span>Call</span>
      </button>
      <button type="button" class="conversation-whatsapp-panel-close" data-whatsapp-panel-close aria-label="Close WhatsApp Conversation" title="Close WhatsApp">×</button>
    </div>
  </header>
  <div class="conversation-whatsapp-thread" data-whatsapp-thread aria-live="polite"></div>
  <form class="conversation-whatsapp-compose" data-whatsapp-form enctype="multipart/form-data">
    <div class="conversation-whatsapp-compose-row">
      <label class="conversation-whatsapp-attach" title="Attach image, video, audio, or document">
        <input type="file" data-whatsapp-media accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5 9 14a2.1 2.1 0 0 0 3 3l7.2-7.2a4 4 0 0 0-5.7-5.7L6 11.6a6 6 0 1 0 8.5 8.5l6-6-1.4-1.4-6 6a4 4 0 0 1-5.7-5.7l7.5-7.5a2 2 0 0 1 2.8 2.8L10.6 15.4a.1.1 0 0 1-.2-.2L17.9 7.9l-1.4-1.4Z" fill="currentColor"/></svg>
      </label>
      <textarea maxlength="4096" rows="2" data-whatsapp-body placeholder="Type a WhatsApp message..."></textarea>
      <button class="button primary conversation-whatsapp-send" type="submit" data-whatsapp-send>Send</button>
    </div>
    <div class="conversation-whatsapp-compose-meta">
      <span data-whatsapp-file-name></span>
      <span data-whatsapp-status aria-live="polite"></span>
    </div>
  </form>
</section>
